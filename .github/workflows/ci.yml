name: Frontend Quality
on:
  pull_request:
  push:
    branches: [master, feature/upgrade-antd-v5]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Install pinned static checkers
        run: node scripts/install-static-checkers.cjs
      - name: Check workflow and shell contracts
        run: |
          node scripts/check-workflow-pins.cjs
          node scripts/check-workflow-pins.test.cjs
          node --test scripts/check-static.test.cjs
          node scripts/check-static.cjs > static-analysis.json
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level moderate --json > dependency-audit.json
      - run: yarn quality
      - run: yarn build
      - run: yarn bundle:check
      - run: yarn test:artifact
      - run: yarn test:vditor-assets
      - run: yarn test:timeouts
      - run: yarn test:security-unit
      - run: yarn test:release-recovery
      - run: yarn test:deployment-smoke
      - name: Verify release artifact
        run: yarn --silent artifact:verify build "$GITHUB_SHA" /v2/ https://oj.qd.sdu.edu.cn/v2/ > artifact-verification.json
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e
      - name: Validate production-like nginx security policies
        run: |
          docker pull nginx:1.28-alpine
          yarn playwright test -c playwright.security.config.ts
      - name: Preserve verified release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-release-build
          path: build/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-test-results
          path: |
            coverage/
            dependency-audit.json
            artifact-verification.json
            static-analysis.json
            output/audit/R-24/proxy/manifest.json
            playwright-report/
            test-results/
          retention-days: 14
