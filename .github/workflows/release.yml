name: Frontend Release

on:
  push:
    tags:
      - 'web2-v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to the production environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifact
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build production bundle
        run: yarn build

      - name: Validate bundle entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -s build/index.html
          grep -q '/v2/' build/index.html

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2-build-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to production
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy == true }}
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.SDUOJ_RELEASE_URL || 'https://oj.qd.sdu.edu.cn/v2/' }}
    permissions:
      contents: read
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: web2-build-${{ github.sha }}
          path: build

      - name: Validate deployment inputs
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SDUOJ_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SDUOJ_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SDUOJ_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SDUOJ_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.SDUOJ_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          case "$DEPLOY_PATH" in
            /|/bin|/etc|/home|/root|/srv|/tmp|/usr|/var)
              echo 'SDUOJ_DEPLOY_PATH must be the application static directory, not a system root.' >&2
              exit 1
              ;;
          esac
          test -s build/index.html

      - name: Install SSH credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SDUOJ_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SDUOJ_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/sduoj-web2-release"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/sduoj-web2-release" >/dev/null

      - name: Publish static files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SDUOJ_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SDUOJ_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.SDUOJ_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/sduoj-web2-release" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_args[@]}" "$remote" "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"
          rsync -az --delete --delay-updates \
            -e "ssh ${ssh_args[*]}" \
            build/ "$remote:$DEPLOY_PATH/"
          ssh "${ssh_args[@]}" "$remote" "test -s '$DEPLOY_PATH/index.html'"

      - name: Smoke test production frontend
        shell: bash
        env:
          RELEASE_URL: ${{ vars.SDUOJ_RELEASE_URL || 'https://oj.qd.sdu.edu.cn/v2/' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$RELEASE_URL" \
            | grep -q '<div id="root"></div>'
