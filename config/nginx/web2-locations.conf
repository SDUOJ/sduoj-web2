root /usr/share/nginx/html;
include /etc/nginx/security/security-headers.conf;

location = /v2 {
    return 308 /v2/;
}

location /v2/ {
    try_files $uri $uri/ /v2/index.html;
}

location /v2/static/ {
    include /etc/nginx/security/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location /v2/vditor/ {
    include /etc/nginx/security/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /v2/index.html {
    include /etc/nginx/security/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /_security/csp {
    client_max_body_size 32k;
    limit_req zone=sduoj_csp_reports burst=20 nodelay;
    proxy_pass http://sduoj_security_reports;
    access_log off;
}

location /api/ {
    proxy_pass http://sduoj_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /ws/ {
    proxy_pass http://sduoj_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
